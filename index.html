<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ─── Viewport ──────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Primary SEO ──────────────────────────────────────────────────── -->
    <title>Anshul Eskey | Product Strategy &amp; Systems Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Anshul Eskey — IIT Roorkee undergraduate exploring product strategy, growth systems, behavioral design, and business intelligence through grounded case studies."
    />
    <meta
      name="keywords"
      content="Anshul Eskey, product strategy, growth systems, behavioral design, case studies, IIT Roorkee, quick commerce, telemedicine, Perplexity GTM"
    />
    <meta name="author" content="Anshul Eskey" />
    <meta name="robots" content="index, follow" />

    <!-- ─── Canonical ────────────────────────────────────────────────────── -->
    <!--
      Replace your-portfolio.vercel.app with your actual live Vercel domain name after deployment.
    -->
    <link rel="canonical" href="https://your-portfolio.vercel.app/" />

    <!-- ─── Open Graph (Facebook / LinkedIn) ─────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anshul Eskey Portfolio" />
    <meta property="og:title" content="Anshul Eskey | Product Strategy &amp; Systems Portfolio" />
    <meta
      property="og:description"
      content="Case studies in product strategy, growth systems, and behavioral design by Anshul Eskey — IIT Roorkee undergraduate."
    />
    <!--
      Replace the og:url and og:image values once your Vercel deployment is live.
      og:image should be an absolute URL to a 1200×630 px image.
    -->
    <meta property="og:url" content="https://your-portfolio.vercel.app/" />
    <meta property="og:image" content="https://your-portfolio.vercel.app/perplexity-ai-india.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anshul Eskey Portfolio — Product Strategy &amp; Systems" />
    <meta property="og:locale" content="en_IN" />

    <!-- ─── Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anshul Eskey | Product Strategy &amp; Systems Portfolio" />
    <meta
      name="twitter:description"
      content="Case studies in product strategy, growth systems, and behavioral design by Anshul Eskey — IIT Roorkee undergraduate."
    />
    <meta name="twitter:image" content="https://your-portfolio.vercel.app/perplexity-ai-india.webp" />
    <!-- <meta name="twitter:site" content="@your_twitter_handle" /> -->

    <!-- ─── Favicon ──────────────────────────────────────────────────────── -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23090909%22/><text y=%2270%22 x=%2220%22 font-family=%22monospace%22 font-size=%2260%22 font-weight=%22bold%22 fill=%22%23ffffff%22>S.</text></svg>"
    />

    <!-- ─── Google Fonts (preconnect first, then stylesheet) ─────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap"
      rel="stylesheet"
    />

    <!-- ─── Theme colour (browser UI) ───────────────────────────────────── -->
    <meta name="theme-color" content="#090909" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
