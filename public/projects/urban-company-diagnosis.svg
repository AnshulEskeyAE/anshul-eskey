<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
    <line x1="1100" y1="0" x2="1100" y2="600"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  
  <!-- Central icon - diagnostic/decision concept -->
  <circle cx="600" cy="280" r="80" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.3"/>
  <circle cx="600" cy="280" r="50" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.5"/>
  <circle cx="600" cy="280" r="20" fill="#00ff88" opacity="0.8"/>
  
  <!-- Decision flow arrows -->
  <path d="M 450 350 L 550 350" stroke="#5ac8fa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 650 350 L 750 350" stroke="#ff9f0a" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5ac8fa"/>
    </marker>
  </defs>
  
  <!-- Title text -->
  <text x="600" y="480" font-family="monospace" font-size="18" fill="#f7f7f7" text-anchor="middle" letter-spacing="2">URBAN COMPANY</text>
  <text x="600" y="510" font-family="monospace" font-size="14" fill="#b4b4b4" text-anchor="middle">Post-Diagnostic Decision Support</text>
</svg>
